# Market Flow — standalone compose (not part of main DSA docker/)
#
# Usage (from market-flow/):
#   docker compose up --build
#   open http://127.0.0.1:8080
#
# Optional: copy .env.example → .env for port / CORS / cache overrides.

name: market-flow

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MARKET_FLOW_API_PORT:-8001}:8001"
    environment:
      TZ: Asia/Shanghai
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5173,http://localhost:5173}
      FLOW_TOP_N: ${FLOW_TOP_N:-10}
      FLOW_TOP_M: ${FLOW_TOP_M:-10}
      CACHE_TTL_REALTIME_SEC: ${CACHE_TTL_REALTIME_SEC:-45}
      CACHE_TTL_DAY_SEC: ${CACHE_TTL_DAY_SEC:-600}
      CACHE_TTL_LONG_SEC: ${CACHE_TTL_LONG_SEC:-3600}
      UPSTREAM_TIMEOUT_SEC: ${UPSTREAM_TIMEOUT_SEC:-20}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MARKET_FLOW_UI_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
