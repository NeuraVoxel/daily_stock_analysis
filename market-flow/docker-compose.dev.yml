# Standalone Vite HMR stack (does not merge with production frontend).
#
# From market-flow/:
#   docker compose -f docker-compose.dev.yml up --build
#   open http://127.0.0.1:5173
#
# Stop production UI first if it also binds host ports you need:
#   docker compose down
#
# Production preview: docker compose up --build → :8080

name: market-flow-dev

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MARKET_FLOW_API_PORT:-8001}:8001"
    environment:
      TZ: Asia/Shanghai
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5173,http://localhost:5173}
      FLOW_TOP_N: ${FLOW_TOP_N:-10}
      FLOW_TOP_M: ${FLOW_TOP_M:-10}
      CACHE_TTL_REALTIME_SEC: ${CACHE_TTL_REALTIME_SEC:-45}
      CACHE_TTL_DAY_SEC: ${CACHE_TTL_DAY_SEC:-600}
      CACHE_TTL_LONG_SEC: ${CACHE_TTL_LONG_SEC:-3600}
      UPSTREAM_TIMEOUT_SEC: ${UPSTREAM_TIMEOUT_SEC:-20}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    command: >
      sh -c "corepack enable
      && corepack prepare pnpm@10.22.0 --activate
      && pnpm install --frozen-lockfile
      && pnpm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      TZ: Asia/Shanghai
      VITE_API_PROXY: http://backend:8001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - market_flow_frontend_node_modules:/app/node_modules
    ports:
      - "${MARKET_FLOW_DEV_UI_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  market_flow_frontend_node_modules:
